<header class="fotmob-navbar">
  <div class="nav-inner">
    <!-- Izquierda: Logo + Buscador -->
    <div class="nav-left">
      <a routerLink="/home" class="brand-logo">
        <img src="logo_futbol.png" alt="Liga Mujeres Diversas">
        <span class="brand-name">LMDM</span>
      </a>

      <div class="search-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.3-4.3"/>
        </svg>
        <input 
          type="text" 
          [(ngModel)]="busqueda" 
          placeholder="Buscar equipos, jugadoras o partidos...">
      </div>
    </div>

    <!-- Centro: Enlaces estilo FotMob -->
    <nav class="nav-links" [class.open]="menuMovilAbierto">
      <button 
        type="button" 
        class="nav-item" 
        [class.active]="seccionActiva === 'partidos'"
        (click)="cambiarSeccion('partidos')">
        Partidos
      </button>
      <button 
        type="button" 
        class="nav-item" 
        [class.active]="seccionActiva === 'noticias'"
        (click)="cambiarSeccion('noticias')">
        Noticias
      </button>
      <button 
        type="button" 
        class="nav-item" 
        [class.active]="seccionActiva === 'ligas'"
        (click)="cambiarSeccion('ligas')">
        Tabla y Ligas
      </button>
      <button 
        type="button" 
        class="nav-item" 
        [class.active]="seccionActiva === 'estadisticas'"
        (click)="cambiarSeccion('estadisticas')">
        Estadísticas
      </button>
    </nav>

    <!-- Derecha: Perfil según rol + Cerrar sesión -->
    <div class="nav-right">
      <span class="role-pill" [ngClass]="rolActual">
        {{ rolActual | uppercase }}
      </span>
      <span class="user-name">{{ usuarioActual }}</span>

      <button type="button" class="logout-btn" (click)="cerrarSesion()" title="Cerrar sesión">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" x2="9" y1="12" y2="12"/>
        </svg>
      </button>

      <!-- Botón hamburguesa para celulares -->
      <button type="button" class="mobile-menu-btn" (click)="menuMovilAbierto = !menuMovilAbierto">
        ☰
      </button>
    </div>
  </div>
</header>

<!-- Área principal vacía lista para desarrollar cada sección -->
<main class="main-content">
  <!-- Aquí irán tus vistas de Partidos, Noticias, Tabla y Estadísticas -->
</main>
