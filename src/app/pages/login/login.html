<!-- Logo fijo en la esquina superior izquierda -->
<a routerLink="/" class="top-left-logo">
  <img src="logo_futbol.png" alt="Liga de Fútbol Mujeres Diversas México">
</a>

<main class="login-container">
  <!-- Selector de Roles (Pills Planos) -->
  <div class="role-tabs" role="tablist">
    <button 
      type="button" 
      class="role-btn admin" 
      [class.active]="rolActivo === 'admin'"
      (click)="cambiarRol('admin')">
      Administrador
    </button>
    <button 
      type="button" 
      class="role-btn equipo" 
      [class.active]="rolActivo === 'equipo'"
      (click)="cambiarRol('equipo')">
      Equipo
    </button>
    <button 
      type="button" 
      class="role-btn jugadora" 
      [class.active]="rolActivo === 'jugadora'"
      (click)="cambiarRol('jugadora')">
      Jugadora/Usuario
    </button>
  </div>

  <!-- Tarjeta del Formulario -->
  <section class="login-card">
    <h1>{{ configActual.titulo }}</h1>
    <p class="subtitle">{{ configActual.subtitulo }}</p>

    @if (configActual.mostrarAvisoAdmin) {
      <div class="security-badge">
        🔒 Acceso restringido con verificación de permisos
      </div>
    }

    <form (ngSubmit)="iniciarSesion()">
      <div class="input-group">
        <input 
          type="text" 
          name="usuario" 
          [(ngModel)]="usuario" 
          [placeholder]="configActual.placeholder" 
          required>
      </div>

      <div class="input-group password-wrapper">
        <input 
          [type]="mostrarPassword ? 'text' : 'password'" 
          name="password" 
          [(ngModel)]="password" 
          placeholder="Contraseña" 
          required>
        <button 
          type="button" 
          class="toggle-pass" 
          (click)="mostrarPassword = !mostrarPassword"
          [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
          @if (mostrarPassword) {
            <!-- Ojo abierto (contraseña visible) -->
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          } @else {
            <!-- Ojo cerrado/tachado (contraseña oculta) -->
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
              <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
              <line x1="2" x2="22" y1="2" y2="22"/>
            </svg>
          }
        </button>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" name="recordar" [(ngModel)]="recordar"> Recordarme
        </label>
        <a routerLink="/recuperar-password" class="forgot-link">Olvidé mi contraseña</a>
      </div>
      

      <button type="submit" class="cta-button">{{ configActual.boton }}</button>
    </form>

    @if (configActual.mostrarRegistro) {
      <p class="register-text">
        {{ configActual.prefijoRegistro }}
        <a [routerLink]="configActual.rutaRegistro">{{ configActual.textoRegistro }}</a>
      </p>
    }
  </section>
</main>
