<!-- Logo fijo en la esquina superior izquierda -->
<a routerLink="/login" class="top-left-logo">
  <img src="logo_futbol.png" alt="Liga de Fútbol Mujeres Diversas México">
</a>

<main class="register-container">
  <section class="register-card">
    <span class="role-badge">Registro de Equipo</span>
    <h1>Registra tu Club</h1>
    <p class="subtitle">Inscribe a tu equipo en la Liga de Fútbol Mujeres Diversas México</p>

    <form (ngSubmit)="registrarEquipo()">
      <!-- ID del Equipo -->
      <div class="input-group">
        <label for="idEquipo">ID del Equipo</label>
        <input 
          id="idEquipo"
          type="text" 
          name="idEquipo" 
          [(ngModel)]="equipo.idEquipo" 
          placeholder="Ej. EQ-2026-01" 
          required>
      </div>

      <!-- Nombre del Equipo -->
      <div class="input-group">
        <label for="nombre">Nombre del Equipo</label>
        <input 
          id="nombre"
          type="text" 
          name="nombre" 
          [(ngModel)]="equipo.nombre" 
          placeholder="Ej. Águilas FC" 
          required>
      </div>

      <!-- Correo electrónico -->
      <div class="input-group">
        <label for="correo">Correo electrónico del Club</label>
        <input 
          id="correo"
          type="email" 
          name="correo" 
          [(ngModel)]="equipo.correo" 
          placeholder="contacto@tuequipo.com" 
          required>
      </div>

      <!-- Contraseña con ícono de ojo -->
      <div class="input-group password-wrapper">
        <label for="password">Contraseña</label>
        <div class="password-field">
          <input 
            id="password"
            [type]="mostrarPassword ? 'text' : 'password'" 
            name="password" 
            [(ngModel)]="equipo.password" 
            placeholder="Mínimo 8 caracteres" 
            required>
          <button 
            type="button" 
            class="toggle-pass" 
            (click)="mostrarPassword = !mostrarPassword"
            [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            @if (mostrarPassword) {
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                <line x1="2" x2="22" y1="2" y2="22"/>
              </svg>
            }
          </button>
        </div>
      </div>

      <button type="submit" class="cta-button">Registrar Equipo</button>
    </form>

    <p class="login-link-text">
      ¿Tu club ya está registrado? <a routerLink="/login">Inicia sesión aquí</a>
    </p>
  </section>
</main>
