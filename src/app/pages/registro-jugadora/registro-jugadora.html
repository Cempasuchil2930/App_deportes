<!-- Logo fijo en la esquina superior izquierda -->
<a routerLink="/login" class="top-left-logo">
  <img src="logo_futbol.png" alt="Liga de Fútbol Mujeres Diversas México">
</a>

<main class="register-container">
  <section class="register-card">
    <span class="role-badge">Registro de Jugadora</span>
    <h1>Crea tu Perfil</h1>
    <p class="subtitle">Únete a la Liga de Fútbol Mujeres Diversas México</p>

    <form (ngSubmit)="registrarJugadora()">
      <!-- Nombre y Apellidos en 2 columnas -->
      <div class="input-row">
        <div class="input-group">
          <label for="nombre">Nombre(s)</label>
          <input 
            id="nombre"
            type="text" 
            name="nombre" 
            [(ngModel)]="jugadora.nombre" 
            placeholder="Ej. Sofía" 
            required>
        </div>

        <div class="input-group">
          <label for="apellidos">Apellidos</label>
          <input 
            id="apellidos"
            type="text" 
            name="apellidos" 
            [(ngModel)]="jugadora.apellidos" 
            placeholder="Ej. Martínez López" 
            required>
        </div>
      </div>

      <!-- Fecha de cumpleaños -->
      <div class="input-group">
        <label for="cumpleanos">Fecha de nacimiento</label>
        <input 
          id="cumpleanos"
          type="date" 
          name="cumpleanos" 
          [(ngModel)]="jugadora.cumpleanos" 
          required>
      </div>

      <!-- Posición y Número de playera en 2 columnas -->
      <div class="input-row">
        <div class="input-group">
          <label for="posicion">Posición</label>
          <select 
            id="posicion"
            name="posicion" 
            [(ngModel)]="jugadora.posicion" 
            required>
            <option value="" disabled selected>Selecciona posición</option>
            @for (pos of posiciones; track pos) {
              <option [value]="pos">{{ pos }}</option>
            }
          </select>
        </div>

        <div class="input-group number-group">
          <label for="numeroPlayera">N° Playera</label>
          <input 
            id="numeroPlayera"
            type="number" 
            name="numeroPlayera" 
            [(ngModel)]="jugadora.numeroPlayera" 
            placeholder="10" 
            min="1" 
            max="99" 
            required>
        </div>
      </div>

      <!-- Correo electrónico -->
      <div class="input-group">
        <label for="correo">Correo electrónico</label>
        <input 
          id="correo"
          type="email" 
          name="correo" 
          [(ngModel)]="jugadora.correo" 
          placeholder="jugadora@ejemplo.com" 
          required>
      </div>

      <!-- Contraseña con ícono de ojo -->
      <div class="input-group password-wrapper">
        <label for="password">Contraseña</label>
        <div class="password-field">
          <input 
            id="password"
            [type]="mostrarPassword ? 'text' : 'password'" 
            name="password" 
            [(ngModel)]="jugadora.password" 
            placeholder="Mínimo 8 caracteres" 
            required>
          <button 
            type="button" 
            class="toggle-pass" 
            (click)="mostrarPassword = !mostrarPassword"
            [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            @if (mostrarPassword) {
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                <line x1="2" x2="22" y1="2" y2="22"/>
              </svg>
            }
          </button>
        </div>
      </div>

      <button type="submit" class="cta-button">Crear Cuenta</button>
    </form>

    <p class="login-link-text">
      ¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión aquí</a>
    </p>
  </section>
</main>
