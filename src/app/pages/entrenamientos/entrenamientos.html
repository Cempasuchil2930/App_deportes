<div class="space-y-8 pb-12">
  <section
    class="rounded-3xl bg-white dark:bg-[#14171C] border border-slate-200 dark:border-[#232730] p-8 flex flex-col lg:flex-row lg:items-center justify-between gap-6"
  >
    <div class="space-y-2 max-w-xl">
      <h1 class="text-3xl font-extrabold tracking-tight">Entrenamiento Personalizado & Coaching</h1>
    </div>

    <div class="flex flex-wrap gap-2">
      @for (cat of categories; track cat) {
        <button
          (click)="selectedCategory.set(cat)"
          [class]="
            selectedCategory() === cat
              ? 'bg-[#0F172A] text-white dark:bg-white dark:text-[#0F172A] font-semibold'
              : 'bg-slate-50 dark:bg-[#0B0D10] text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-[#232730] hover:border-purple-400'
          "
          class="px-4 py-2 rounded-full text-xs transition"
        >
          {{ cat }}
        </button>
      }
    </div>
  </section>

  <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    @for (item of filteredServices(); track item.coachName) {
      <article
        class="card-hover-prism rounded-2xl bg-white dark:bg-[#14171C] border border-slate-200 dark:border-[#232730] p-6 flex flex-col justify-between space-y-6"
      >
        <div class="space-y-4">
          <span
            [class]="item.badgeStyle"
            class="inline-block px-3 py-1 rounded-full text-xs font-bold"
          >
            {{ item.discipline }}
          </span>

          <h2 class="text-lg font-extrabold text-slate-900 dark:text-white">
            {{ item.coachName }}
          </h2>

          <div
            class="p-3 rounded-xl bg-slate-50 dark:bg-[#0B0D10] text-xs font-medium text-slate-600 dark:text-slate-400"
          >
            {{ item.credentials }}
          </div>

          <p class="text-xs md:text-sm text-slate-600 dark:text-slate-300 leading-relaxed">
            {{ item.description }}
          </p>
        </div>

        <button
          type="button"
          (click)="contactCoach(item.coachName)"
          [class]="item.btnStyle"
          class="w-full py-3 rounded-xl text-xs font-bold text-white text-center shadow-sm hover:opacity-95 transition cursor-pointer"
        >
          Contactar entrenador@
        </button>
      </article>
    }
  </section>

  @if (coachNotification(); as note) {
    <div
      class="fixed bottom-6 right-6 z-50 flex items-center gap-3 px-4 py-3 rounded-full bg-[#0B1220] text-white text-xs sm:text-sm font-semibold border border-slate-700/80 shadow-lg"
    >
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0"></span>
      <span>{{ note }}</span>
      <button
        type="button"
        (click)="coachNotification.set(null)"
        class="ml-1 text-slate-400 hover:text-white cursor-pointer"
      >
        ✕
      </button>
    </div>
  }
</div>
